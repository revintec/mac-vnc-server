<!doctype html><meta charset="utf-8"><title>Local file-drop compatibility test</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<style>body{font:22px system-ui;padding:30px;background:#fafafa}#zone{height:240px;border:4px dashed #078;border-radius:12px;padding:24px}pre{white-space:pre-wrap;font:17px monospace}</style>
<h1>Local file-drop compatibility test</h1><p>Nothing is uploaded. This page only reads synthetic test files locally.</p>
<div id="zone">Drop promise or local-file cards here.</div><p><input id="file" type="file" multiple></p><pre id="log">Ready.</pre>
<script>const log=document.querySelector('#log');function out(s){log.textContent+='\n'+s}async function files(fs){out('files='+fs.length);for(const f of fs){const b=await f.arrayBuffer();out(JSON.stringify({name:f.name,size:f.size,type:f.type,readBytes:b.byteLength,text:f.type.startsWith('text')?new TextDecoder().decode(b):null}))}}const z=document.querySelector('#zone');z.ondragenter=e=>{e.preventDefault();out('dragenter types='+Array.from(e.dataTransfer.types))};z.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'};z.ondrop=e=>{e.preventDefault();out('drop types='+Array.from(e.dataTransfer.types));files(e.dataTransfer.files)};document.querySelector('#file').onchange=e=>files(e.target.files)</script>
